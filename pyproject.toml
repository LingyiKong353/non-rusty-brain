[project]
name = "non-rusty-brain"
version = "0.1.0"
description = "Notes, summaries and runnable notebooks from books and courses"
requires-python = ">=3.11,<3.12"
dependencies = [
    # torch 2.2.2 is the last release with Intel macOS wheels, and it needs NumPy 1.x.
    "torch==2.2.2",
    "numpy<2",
    "matplotlib",
    "ipykernel",
    "nbconvert",
    "nbformat",
]

[tool.uv]
package = false
