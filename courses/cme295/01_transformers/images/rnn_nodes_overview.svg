<text x="450" y="566" text-anchor="middle" font-size="12.5" fill="#475569">Each node is a number. A dashed line is a negative weight. No line means the weight is 0. h<tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> is the output of step 1 and the old memory of step 2.</tspan></text>
