<text x="270" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Step 1:  h<tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> = tanh(W</tspan><tspan dy="4" font-size="9">xh</tspan><tspan dy="-4"> x</tspan><tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> + W</tspan><tspan dy="4" font-size="9">hh</tspan><tspan dy="-4"> h</tspan><tspan dy="4" font-size="9">0</tspan><tspan dy="-4"> + b)</tspan></text>
