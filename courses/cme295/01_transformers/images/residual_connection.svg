<text x="56.0" y="528.0" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c" >Without the residual connection:  y = F(x)</text>
<text x="470.0" y="528.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >the attention layer must produce the whole output.</text>
<text x="56.0" y="554.0" text-anchor="start" font-size="13" font-weight="800" fill="#166534" >With the residual connection:  y = x + F(x)</text>
<text x="470.0" y="554.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >the attention layer produces an update, and x has a direct path to the output.</text>
<text x="56.0" y="584.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#475569" font-family="'SF Mono',Menlo,Consolas,monospace">[\u22120.10, 0.90, 0.40, 0.20] + [0.80, 0.87, 0.67, 1.00] = [0.70, 1.77, 1.07, 1.20]</text>
<text x="56.0" y="608.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#475569" >Each box of nodes is a vector of 4 numbers, one per node. Attention mixes tokens; it is not a layer of learned per-connection weights like the feed-forward network.</text>
