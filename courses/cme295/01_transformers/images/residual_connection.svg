<text x="320.0" y="184.0" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" font-family="'SF Mono',Menlo,Consolas,monospace">softmax(Q Kᵀ/√dₖ) V</text>
<text x="320.0" y="210.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569" >(notebook 03, section 2)</text>
