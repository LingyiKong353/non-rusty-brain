<text x="170" y="340" font-size="14" fill="#0f172a" font-family="'SF Mono',Menlo,Consolas,monospace">1.5×(1.0) + (−1.3)×(0.1) = <tspan font-weight="800">1.37</tspan></text>
<text x="62" y="374" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">teddy</text>
<text x="170" y="374" font-size="14" fill="#0f172a" font-family="'SF Mono',Menlo,Consolas,monospace">1.5×(1.2) + (−1.3)×(−0.2) = <tspan font-weight="800">2.06</tspan></text>
