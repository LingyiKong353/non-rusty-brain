<text x="62" y="272" text-anchor="start" font-size="13.5" font-weight="700" fill="#92400e">Each score is a dot product: multiply number by number, then add.</text>
<text x="62" y="306" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">A</text>
<text x="170" y="306" font-size="14" fill="#0f172a" font-family="'SF Mono',Menlo,Consolas,monospace">1.5×(−0.4) + (−1.3)×(0.1) = <tspan font-weight="800">−0.73</tspan></text>
